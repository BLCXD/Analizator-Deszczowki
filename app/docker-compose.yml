services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ad_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file: .env
    environment:
      NVIDIA_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - path: .env.mail
        required: false
      - .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./flask-frontend-user
    env_file: .env
    environment:
      FLASK_ENV: production
      API_BASE_URL: http://backend:8000
      MOCK_RUNNER_URL: http://mock-runner:8090
      SESSION_DB_PATH: /data/flask-sessions.sqlite
      RATE_LIMIT_DB_PATH: /data/rate-limits.sqlite
      NVIDIA_API_KEY: ""
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_sessions:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/_health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mock-runner:
    build:
      context: ..
      dockerfile: app/mock-runner/Dockerfile
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      DB_DIR: /data
      MOCK_INTERVAL_SECONDS: ${MOCK_INTERVAL_SECONDS:-30}
      NVIDIA_API_KEY: ""
    volumes:
      - mock_agent_data:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_sessions:
  mock_agent_data:
